<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Junkreaper: an elevator car rising in a lit shaft.
       Deliberately bold and low-detail so it survives a 16px favicon. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a26"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd071"/>
      <stop offset="1" stop-color="#e29a1f"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b944" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f5b944" stop-opacity=".28"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#ground)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#2a3547" stroke-width="3"/>

  <!-- hoist cable -->
  <rect x="171" y="96" width="6" height="120" rx="3" fill="#ffffff" opacity=".22"/>

  <!-- the car, mid-shaft, doors just parting -->
  <rect x="104" y="206" width="140" height="176" rx="20" fill="#111722" stroke="#3a475d" stroke-width="7"/>
  <rect x="124" y="226" width="100" height="136" rx="10" fill="url(#amber)"/>
  <rect x="168" y="226" width="12" height="136" fill="#111722" opacity=".85"/>

  <!-- floors to the right: the top three lit, the rest waiting -->
  <g>
    <rect x="288" y="132" width="120" height="30" rx="9" fill="url(#lit)"/>
    <rect x="288" y="190" width="120" height="30" rx="9" fill="url(#lit)"/>
    <rect x="288" y="248" width="120" height="30" rx="9" fill="url(#lit)"/>
    <rect x="288" y="306" width="120" height="30" rx="9" fill="#ffffff" opacity=".10"/>
    <rect x="288" y="364" width="120" height="30" rx="9" fill="#ffffff" opacity=".07"/>
  </g>

  <!-- direction arrow -->
  <path d="M174 118 l34 42 h-68 z" fill="#f5b944"/>
</svg>
